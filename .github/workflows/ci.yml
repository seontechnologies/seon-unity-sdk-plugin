name: SEON Unity SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  UNITY_VERSION: "6000.0.38f1"
  PACKAGE_PATH: "io.seon.unitysdk"

jobs:
  # ── Unit Tests ─────────────────────────────────────────
  test:
    name: "EditMode Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: TestProject/Library
          key: library-${{ hashFiles('io.seon.unitysdk/**') }}
          restore-keys: library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          projectPath: TestProject
          customParameters: -nographics
          artifactsPath: test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

  # ── Package Assembly (no Unity needed) ─────────────────
  assemble:
    name: "Package UPM + .tgz"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('${{ env.PACKAGE_PATH }}/package.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package UPM tarball
        run: |
          cd ${{ env.PACKAGE_PATH }}
          tar -czf ../io.seon.unitysdk-${{ steps.version.outputs.version }}.tgz \
            --exclude='*.meta' .

      - uses: actions/upload-artifact@v4
        with:
          name: upm-package
          path: "io.seon.unitysdk-${{ steps.version.outputs.version }}.tgz"

  # ── Build iOS Sample ──────────────────────────────────
  build-ios:
    name: "Build iOS Sample"
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: TestProject/Library
          key: library-ios-${{ hashFiles('io.seon.unitysdk/**') }}

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          projectPath: TestProject

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/iOS

  # ── Build Android Sample ──────────────────────────────
  build-android:
    name: "Build Android Sample"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: TestProject/Library
          key: library-android-${{ hashFiles('io.seon.unitysdk/**') }}

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          projectPath: TestProject

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/Android

  # ── Release ────────────────────────────────────────────
  release:
    name: "Publish Release"
    runs-on: ubuntu-latest
    needs: [assemble, build-ios, build-android]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: upm-package

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: "io.seon.unitysdk-*.tgz"
