---
format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other

# ──────────────────────────────────────────────────────
# SEON Unity SDK - Bitrise CI/CD Configuration
#
# Workflows:
#   test       - Run EditMode unit tests (on every push/PR)
#   assemble   - Package plugin (no Unity needed)
#   build-ios  - Build iOS sample for integration testing
#   build-android - Build Android sample for integration testing
#   release    - Export .unitypackage + UPM .tgz, create release
# ──────────────────────────────────────────────────────

app:
  envs:
    - UNITY_VERSION: "6000.0.38f1" # Unity 6 LTS
    - PACKAGE_PATH: "io.seon.unitysdk"
    - TEST_PROJECT_PATH: "TestProject"

trigger_map:
  - push_branch: "main"
    workflow: test
  - pull_request_source_branch: "*"
    workflow: test
  - tag: "v*"
    workflow: release

workflows:
  # ── Test Workflow ──────────────────────────────────────
  test:
    steps:
      - git-clone@8: {}

      - script@1:
          title: "Install Unity (cached)"
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail

                # Check if Unity is already cached
                if [ -d "$HOME/Unity/Hub/Editor/$UNITY_VERSION" ]; then
                  echo "Unity $UNITY_VERSION already installed (cached)."
                  exit 0
                fi

                echo "Installing Unity $UNITY_VERSION..."
                /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub -- \
                  --headless install \
                  --version "$UNITY_VERSION" \
                  --module ios android

      - script@1:
          title: "Activate Unity Personal License"
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail

                UNITY_PATH="$HOME/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"

                # Activate using .ulf file stored as Bitrise secret file
                "$UNITY_PATH" -batchmode -nographics \
                  -serial "$UNITY_SERIAL" \
                  -username "$UNITY_EMAIL" \
                  -password "$UNITY_PASSWORD" \
                  -quit || true

      - script@1:
          title: "Create Test Project & Import Plugin"
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail

                UNITY_PATH="$HOME/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"

                # Create a minimal Unity project for testing
                "$UNITY_PATH" -batchmode -nographics \
                  -createProject "$TEST_PROJECT_PATH" \
                  -quit

                # Link the plugin package via local file reference
                mkdir -p "$TEST_PROJECT_PATH/Packages"
                cat > "$TEST_PROJECT_PATH/Packages/manifest.json" << EOF
                {
                  "dependencies": {
                    "io.seon.unitysdk": "file:../../$PACKAGE_PATH"
                  }
                }
                EOF

      - script@1:
          title: "Run EditMode Tests"
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail

                UNITY_PATH="$HOME/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"

                "$UNITY_PATH" -batchmode -nographics \
                  -projectPath "$TEST_PROJECT_PATH" \
                  -runTests \
                  -testPlatform EditMode \
                  -testResults "$BITRISE_DEPLOY_DIR/test-results-editmode.xml"

                echo "EditMode tests completed."

      - deploy-to-bitrise-io@2:
          inputs:
            - deploy_path: "$BITRISE_DEPLOY_DIR/test-results-editmode.xml"

      - script@1:
          title: "Return Unity License"
          is_always_run: true
          inputs:
            - content: |
                #!/bin/bash
                UNITY_PATH="$HOME/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"
                "$UNITY_PATH" -batchmode -nographics -returnlicense -quit || true

  # ── Assemble Workflow (no Unity needed) ────────────────
  assemble:
    steps:
      - git-clone@8: {}

      - script@1:
          title: "Package UPM .tgz"
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                cd "$PACKAGE_PATH"
                VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
                tar -czf "$BITRISE_DEPLOY_DIR/io.seon.unitysdk-$VERSION.tgz" \
                  --exclude='*.meta' .
                echo "Packaged io.seon.unitysdk-$VERSION.tgz"

      - deploy-to-bitrise-io@2: {}

  # ── Release Workflow ───────────────────────────────────
  release:
    before_run:
      - test
      - assemble
    steps:
      - script@1:
          title: "Export .unitypackage"
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail

                UNITY_PATH="$HOME/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"
                VERSION=$(python3 -c "import json; print(json.load(open('$PACKAGE_PATH/package.json'))['version'])")

                # Export .unitypackage using Unity batch mode
                "$UNITY_PATH" -batchmode -nographics \
                  -projectPath "$TEST_PROJECT_PATH" \
                  -exportPackage "Packages/io.seon.unitysdk" \
                  "$BITRISE_DEPLOY_DIR/SeonSDK-$VERSION.unitypackage" \
                  -quit

      - github-release@0:
          inputs:
            - api_token: "$GITHUB_TOKEN"
            - repository_url: "$GIT_REPOSITORY_URL"
            - tag: "$BITRISE_GIT_TAG"
            - name: "SEON Unity SDK $BITRISE_GIT_TAG"
            - body: "See CHANGELOG.md for details."
            - files_to_upload: "$BITRISE_DEPLOY_DIR/*.tgz|$BITRISE_DEPLOY_DIR/*.unitypackage"

  # ── Cache Config ──────────────────────────────────────
  _cache:
    steps:
      - cache-pull@2: {}
      - cache-push@2:
          inputs:
            - cache_paths: |
                $HOME/Unity/Hub/Editor/$UNITY_VERSION
                $TEST_PROJECT_PATH/Library
